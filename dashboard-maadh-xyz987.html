<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بوابة إدارة الأعمال | مِحور</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Cairo', sans-serif; background-color: #f1f5f9; }</style>
</head>
<body class="p-6">
    <div class="max-w-4xl mx-auto bg-white rounded-xl shadow-lg p-8">
        <h1 class="text-3xl font-bold mb-6 text-slate-800">بوابة الإدارة - أ. معاذ اليعقوبي</h1>
        
        <div class="bg-blue-50 border border-blue-200 p-4 rounded-lg mb-8">
            <h2 class="font-bold text-blue-800 mb-4">إضافة عمل جديد للمنصة</h2>
            <form id="add-project-form" class="space-y-4">
                <div>
                    <label class="block text-sm font-bold mb-1">كلمة المرور للإدارة</label>
                    <input type="password" id="admin-pass" required class="w-full p-2 border rounded" placeholder="أدخل كلمة المرور">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">عنوان العمل/الخدمة</label>
                    <input type="text" id="p-title" required class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">السعر (ر.ع)</label>
                    <input type="text" id="p-price" required class="w-full p-2 border rounded" placeholder="مثال: 50 أو حسب الاتفاق">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">نبذة عن العمل (تظهر في زر التفاصيل)</label>
                    <textarea id="p-desc" required class="w-full p-2 border rounded h-24"></textarea>
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">صورة الغلاف (رئيسية)</label>
                    <input type="file" id="p-cover" accept="image/*" required class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">ملفات مرفقة (مستندات، صور إضافية، مضغوط) - اختياري</label>
                    <input type="file" id="p-files" multiple class="w-full p-2 border rounded">
                </div>
                <div>
                    <label class="block text-sm font-bold mb-1">روابط خارجية (مثل رابط يوتيوب أو ملف كبير جداً) - اختياري</label>
                    <input type="text" id="p-links" class="w-full p-2 border rounded" placeholder="ضع الروابط هنا...">
                </div>
                
                <button type="submit" id="add-btn" class="bg-slate-900 text-white font-bold py-2 px-6 rounded hover:bg-blue-700 w-full">رفع العمل للمنصة</button>
            </form>
        </div>

        <div>
            <h2 class="font-bold text-red-800 mb-4 border-b pb-2">حذف الأعمال الحالية</h2>
            <div id="projects-list" class="space-y-3">
                <p class="text-gray-500 text-sm">جاري جلب الأعمال...</p>
            </div>
        </div>
    </div>

    <script>
        // *** ضع رابط الـ Web App هنا ***
        const SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE';

        // جلب الأعمال وعرضها للحذف
        function loadProjects() {
            fetch(SCRIPT_URL)
            .then(res => res.json())
            .then(data => {
                const list = document.getElementById('projects-list');
                list.innerHTML = '';
                if(data.length === 0) { list.innerHTML = '<p class="text-sm">لا توجد أعمال حالياً.</p>'; return; }
                data.forEach(p => {
                    list.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-3 border rounded">
                            <span class="font-bold">${p.title} (${p.price} ر.ع)</span>
                            <button onclick="deleteProject('${p.id}')" class="bg-red-600 text-white px-3 py-1 rounded text-sm hover:bg-red-800">حذف</button>
                        </div>
                    `;
                });
            });
        }

        loadProjects();

        // تحويل الملف لمعالجة البيانات
        const getBase64 = (file) => new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.readAsDataURL(file);
            reader.onload = () => resolve({
                name: file.name,
                mimeType: file.type,
                base64: reader.result.split(',')[1]
            });
            reader.onerror = error => reject(error);
        });

        // رفع عمل جديد
        document.getElementById('add-project-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('add-btn');
            btn.innerText = "جاري الرفع... يرجى الانتظار (قد يستغرق وقتاً للملفات الكبيرة)";
            btn.disabled = true;

            try {
                const coverInput = document.getElementById('p-cover').files[0];
                const filesInput = document.getElementById('p-files').files;
                
                const coverFile = await getBase64(coverInput);
                const extraFiles = [];
                for(let i=0; i<filesInput.length; i++){
                    extraFiles.push(await getBase64(filesInput[i]));
                }

                const payload = {
                    action: "addProject",
                    password: document.getElementById('admin-pass').value,
                    title: document.getElementById('p-title').value,
                    price: document.getElementById('p-price').value,
                    description: document.getElementById('p-desc').value,
                    externalLinks: document.getElementById('p-links').value,
                    coverFile: coverFile,
                    extraFiles: extraFiles
                };

                const response = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
                const result = await response.json();
                
                if(result.result === 'success') {
                    alert('تمت الإضافة بنجاح!');
                    e.target.reset();
                    loadProjects();
                } else {
                    alert('خطأ: ' + result.message);
                }
            } catch(err) {
                alert('حدث خطأ أثناء المعالجة!');
            }
            btn.innerText = "رفع العمل للمنصة";
            btn.disabled = false;
        });

        // حذف عمل
        function deleteProject(id) {
            const pass = prompt("أدخل كلمة المرور لتأكيد الحذف:");
            if(!pass) return;
            
            fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify({ action: "deleteProject", password: pass, projectId: id })
            })
            .then(res => res.json())
            .then(res => {
                if(res.result === 'success') { alert('تم الحذف'); loadProjects(); }
                else { alert('خطأ: ' + res.message); }
            });
        }
    </script>
</body>
</html>
